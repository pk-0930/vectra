name: Validate web application
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectra-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vectra-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  backend-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mobility-ai-service/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libegl1 libgles2
      - run: pip install -r mobility-ai-service/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: mobility-ai-service
      - run: python -m unittest discover -s database/tests -v
        env:
          VECTRA_RUN_MIGRATION_TESTS: '1'
